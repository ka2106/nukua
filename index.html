<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Договоры · Аналитика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo-wrap">
      <div class="logo-mark">Д</div>
      <div class="logo-text">Договоры · Аналитика</div>
    </div>
    <div class="header-status" id="last-update">Загрузка…</div>
  </header>

  <main class="main-content" id="content">
    <div class="table-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="table-container">
        <div class="table-header">
          <div>
            <div class="table-title" id="table-title">Договоры</div>
            <div class="table-subtitle" id="table-subtitle"></div>
          </div>
          <div style="display:flex;gap:8px;">
            <input class="search-input" id="search" placeholder="Поиск по ID, договору, подрядчику…">
            <button class="btn btn-secondary" id="btn-export" disabled>Экспорт в Excel</button>
          </div>
        </div>
        <div id="kpi-grid" class="kpi-grid"></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
